version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    container_name: creditkasa_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: creditkasa_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Kyiv
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always
    depends_on:
      qdrant:
        condition: service_healthy

  api:
    build: .
    container_name: creditkasa_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
    restart: always
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
  n8n_data:
